# Checks Discord's current class names daily and opens a PR when any
# used in scss/ have changed. Merging the PR triggers the Build workflow.
name: Update class names

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fedeericodl/discord-update-classnames@main
        with:
          files: "scss/**/*.scss"
          commit-message: "update class names"
          pr-title: "Update Discord class names"
