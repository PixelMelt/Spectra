# Compiles scss/ into dist/ and publishes it. Every client imports
# dist/ from GitHub Pages, so a push here updates everyone's theme.
name: Build

on:
  push:
    branches: [main]
    paths: ["scss/**", "package.json", "package-lock.json", ".github/workflows/build.yml"]
  pull_request:
    paths: ["scss/**", "package.json", "package-lock.json", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the job on any Sass error, so a broken build never reaches dist/
      - run: npm run build

      - name: Commit dist and publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "dist already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "build dist"
          git push
          # pushes made with GITHUB_TOKEN don't always trigger a Pages build
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
