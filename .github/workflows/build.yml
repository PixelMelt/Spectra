name: Build

on:
    push:
        branches: [main]
        paths: ["scss/**", "header.txt", "build.js", "package.json", "bun.lock", ".github/workflows/build.yml"]
    pull_request:
        paths: ["scss/**", "header.txt", "build.js", "package.json", "bun.lock", ".github/workflows/build.yml"]
    workflow_dispatch:

permissions:
    contents: write
    pages: write

concurrency:
    group: build-${{ github.ref }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile

            - run: bun run build

            - name: Commit dist and publish
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git add dist
                  if git diff --cached --quiet; then
                    echo "dist already up to date"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
                  git commit -m "build dist"
                  git push
                  gh api -X POST "repos/${{ github.repository }}/pages/builds"
